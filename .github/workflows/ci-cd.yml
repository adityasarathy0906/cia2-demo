
name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean verify

      - name: Log in to Azure using OIDC
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        if: github.event_name != 'pull_request'
        run: az acr login --name adityacia2acr

      - name: Build Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker build -t adityacia2acr.azurecr.io/cia2-demo:${{ github.sha }} .
          docker tag adityacia2acr.azurecr.io/cia2-demo:${{ github.sha }} adityacia2acr.azurecr.io/cia2-demo:latest

      - name: Push Docker image to ACR
        if: github.event_name != 'pull_request'
        run: |
          docker push adityacia2acr.azurecr.io/cia2-demo:${{ github.sha }}
          docker push adityacia2acr.azurecr.io/cia2-demo:latest

      - name: Get AKS credentials
        if: github.event_name != 'pull_request'
        run: |
          az aks get-credentials --resource-group cia2-rg --name cia2-aks --admin --overwrite-existing

      - name: Deploy to AKS
        if: github.event_name != 'pull_request'
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/cia2-demo --timeout=180s
